<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meltdown</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #020617; }
        
        input[type="file"]::file-selector-button {
            background-color: #84cc16;
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-right: 20px;
            font-family: monospace;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #a3e635;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18?dev';
        import ReactDOM from 'https://esm.sh/react-dom@18/client?dev';
        import { 
            Skull, Zap, Volume2, VolumeX, Trophy, ArrowLeft, CheckCircle, XCircle, 
            Brain, Calculator, Ruler, Hash, Percent, AlertTriangle, Layers, FastForward, 
            Bomb, Star, Frown, Sword, Shield, Biohazard, Heart, Upload, FileText, Mic
        } from 'https://esm.sh/lucide-react@0.292.0?dev';

        // --- DATEN-STRUKTUREN ---
        
        let QUESTIONS_R1 = { KA: [[],[],[],[],[]], KB: [[],[],[],[],[]], KC: [[],[],[],[],[]], KD: [[],[],[],[],[]], KE: [[],[],[],[],[]] };
        let QUESTIONS_R2 = { KF: [[],[],[],[],[]], KG: [[],[],[],[],[]], KH: [[],[],[],[],[]], KI: [[],[],[],[],[]], KJ: [[],[],[],[],[]] };
        let BOSS_QUESTIONS = [];

        let CATEGORIES_R1 = [
          { id: 'KA', name: 'Kategorie A' }, { id: 'KB', name: 'Kategorie B' },
          { id: 'KC', name: 'Kategorie C' }, { id: 'KD', name: 'Kategorie D' }, { id: 'KE', name: 'Kategorie E' },
        ];

        let CATEGORIES_R2 = [
          { id: 'KF', name: 'Kategorie F' }, { id: 'KG', name: 'Kategorie G' },
          { id: 'KH', name: 'Kategorie H' }, { id: 'KI', name: 'Kategorie I' }, { id: 'KJ', name: 'Kategorie J' },
        ];

        // MAPPING ID ZU ICON
        const ICON_MAP = {
            KA: <Hash className="w-6 h-6" />, KB: <Ruler className="w-6 h-6" />, KC: <Calculator className="w-6 h-6" />, KD: <Percent className="w-6 h-6" />, KE: <Brain className="w-6 h-6" />,
            KF: <Brain className="w-6 h-6" />, KG: <Ruler className="w-6 h-6" />, KH: <Percent className="w-6 h-6" />, KI: <Zap className="w-6 h-6" />, KJ: <Skull className="w-6 h-6" />
        };

        const parseQuestionsFile = (text) => {
            QUESTIONS_R1 = { KA: [[],[],[],[],[]], KB: [[],[],[],[],[]], KC: [[],[],[],[],[]], KD: [[],[],[],[],[]], KE: [[],[],[],[],[]] };
            QUESTIONS_R2 = { KF: [[],[],[],[],[]], KG: [[],[],[],[],[]], KH: [[],[],[],[],[]], KI: [[],[],[],[],[]], KJ: [[],[],[],[],[]] };
            BOSS_QUESTIONS = [];
            
            CATEGORIES_R1 = [{ id: 'KA', name: 'Kategorie A' }, { id: 'KB', name: 'Kategorie B' }, { id: 'KC', name: 'Kategorie C' }, { id: 'KD', name: 'Kategorie D' }, { id: 'KE', name: 'Kategorie E' }];
            CATEGORIES_R2 = [{ id: 'KF', name: 'Kategorie F' }, { id: 'KG', name: 'Kategorie G' }, { id: 'KH', name: 'Kategorie H' }, { id: 'KI', name: 'Kategorie I' }, { id: 'KJ', name: 'Kategorie J' }];

            const lines = text.split(/\r?\n/);
            let currentTag = null;
            const regexQ = /^\[(R1|R2):(\w+):(\d+)\]$/;   
            const regexBoss = /^\[BOSS\]$/;               
            const regexCat = /^\[CAT:(R1|R2):(\w+)\](.*)$/; 

            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine || cleanLine.startsWith('//')) return; 

                const matchCat = cleanLine.match(regexCat);
                if (matchCat) {
                    const round = matchCat[1];
                    const id = matchCat[2];
                    const newName = matchCat[3].trim();
                    if (round === 'R1') { const cat = CATEGORIES_R1.find(c => c.id === id); if (cat) cat.name = newName; } 
                    else { const cat = CATEGORIES_R2.find(c => c.id === id); if (cat) cat.name = newName; }
                    return;
                }

                const matchQ = cleanLine.match(regexQ);
                if (matchQ) { currentTag = { type: matchQ[1], cat: matchQ[2], pts: parseInt(matchQ[3]) }; return; }
                if (regexBoss.test(cleanLine)) { currentTag = { type: 'BOSS' }; return; }

                if (currentTag && cleanLine.includes('|')) {
                    const parts = cleanLine.split('|');
                    const q = parts[0].trim();
                    const a = parts.slice(1).join('|').trim(); 
                    
                    if (currentTag.type === 'BOSS') { BOSS_QUESTIONS.push({ q, a }); } 
                    else {
                        const idx = (currentTag.pts / 100) - 1;
                        if (idx >= 0 && idx <= 4) {
                            if (currentTag.type === 'R1' && QUESTIONS_R1[currentTag.cat]) QUESTIONS_R1[currentTag.cat][idx].push({ q, a });
                            else if (currentTag.type === 'R2' && QUESTIONS_R2[currentTag.cat]) QUESTIONS_R2[currentTag.cat][idx].push({ q, a });
                        }
                    }
                }
            });
            return true;
        };

        const generateRandomEvents = () => {
          const allCoords = [];
          for(let c=0; c<5; c++) { for(let r=0; r<5; r++) { allCoords.push(`${c}-${r}`); } }
          for (let i = allCoords.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [allCoords[i], allCoords[j]] = [allCoords[j], allCoords[i]];
          }
          return { bonus: allCoords.slice(0, 5), trap: allCoords.slice(5, 7), lucky: allCoords.slice(7, 9), double: allCoords.slice(9, 10) };
        };

        // --- AUDIO ENGINE (QUIET VERSION) ---
        class AudioEngine {
          constructor() { this.ctx = null; this.isPlaying = false; this.sequencerInterval = null; this.sirenInterval = null; }
          init() { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } }
          playTone(freq, type, duration, vol = 0.1, startTime = 0) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime + startTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + startTime + duration);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + startTime); osc.stop(this.ctx.currentTime + startTime + duration);
          }
          playNoise(duration) {
            if (!this.ctx) return;
            const bufferSize = this.ctx.sampleRate * duration; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            const gain = this.ctx.createGain(); gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            noise.connect(gain); gain.connect(this.ctx.destination); noise.start();
          }
          playWhoosh() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain(); const filter = this.ctx.createBiquadFilter();
            const bufferSize = this.ctx.sampleRate * 0.5; const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = this.ctx.createBufferSource(); noise.buffer = buffer;
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(200, this.ctx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(3000, this.ctx.currentTime + 0.2); filter.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.3, this.ctx.currentTime + 0.1); gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.5);
            noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination); noise.start();
          }
          playImpact() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.frequency.setValueAtTime(150, this.ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.5, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.5);
          }
          playElevatorMusic() {
            if (this.isPlaying || !this.ctx) return; this.isPlaying = true; let step = 0;
            const chord1 = [261.63, 329.63, 392.00, 493.88]; const chord2 = [293.66, 349.23, 440.00, 523.25]; const bass = [130.81, 146.83];
            this.sequencerInterval = setInterval(() => {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const barStep = step % 16; const currentChord = step % 32 < 16 ? chord1 : chord2; const currentBass = step % 32 < 16 ? bass[0] : bass[1];
                if (barStep === 0 || barStep === 10) this.playTone(currentBass, 'sine', 0.5, 0.2);
                if (barStep % 4 === 0) { const noteIdx = (barStep / 4) % 4; this.playTone(currentChord[noteIdx], 'triangle', 0.4, 0.05); }
                if (barStep % 2 === 0) this.playNoise(0.02); step++;
            }, 200); 
          }
          playAlarmSequence() {
             if (!this.ctx) return; this.isPlaying = true;
             this.sirenInterval = setInterval(() => {
                 const now = this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                 osc.type = 'sawtooth'; const freq = (Date.now() % 400 < 200) ? 800 : 600;
                 osc.frequency.setValueAtTime(freq, now); gain.gain.setValueAtTime(0.1, now);
                 gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                 osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.1);
             }, 150); 
          }
          playSiren() {
            if (!this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(400, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.3); osc.frequency.linearRampToValueAtTime(400, this.ctx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.08, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0.08, this.ctx.currentTime + 0.6);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 0.6);
          }
          startSirenLoop() { this.playSiren(); this.sirenInterval = setInterval(() => this.playSiren(), 600); }
          stopSirenLoop() { if (this.sirenInterval) clearInterval(this.sirenInterval); }
          playFailSound() {
            if (!this.ctx) return;
            const osc1 = this.ctx.createOscillator(); const osc2 = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc1.type = 'sawtooth'; osc2.type = 'square';
            osc1.frequency.setValueAtTime(300, this.ctx.currentTime); osc2.frequency.setValueAtTime(315, this.ctx.currentTime); 
            osc1.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 1.5); osc2.frequency.exponentialRampToValueAtTime(55, this.ctx.currentTime + 1.5);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 1.5);
            osc1.connect(gain); osc2.connect(gain); gain.connect(this.ctx.destination);
            osc1.start(); osc2.start(); osc1.stop(this.ctx.currentTime + 1.5); osc2.stop(this.ctx.currentTime + 1.5);
          }
          playJackpotSound() {
            if (!this.ctx) return;
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; const now = this.ctx.currentTime;
            notes.forEach((freq, i) => {
                const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
                osc.type = 'square'; osc.frequency.setValueAtTime(freq, now + i * 0.08);
                gain.gain.setValueAtTime(0.05, now + i * 0.08); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
            });
            setTimeout(() => { this.playTone(1046.50, 'sine', 1.0, 0.3); }, notes.length * 80);
          }
          playDoubleTroubleSound() {
            if (!this.ctx) return; const now = this.ctx.currentTime; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.5); osc.frequency.linearRampToValueAtTime(200, now + 1.0);
            osc.frequency.linearRampToValueAtTime(800, now + 1.5); osc.frequency.linearRampToValueAtTime(1200, now + 2.0);
            gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 2.0);
            osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 2.0);
          }
          playMusic() {
            if (this.isPlaying || !this.ctx) return; this.isPlaying = true; let step = 0;
            const melody = [329.63, 0, 329.63, 392.00, 440.00, 0, 392.00, 329.63, 293.66, 0, 293.66, 392.00, 369.99, 0, 293.66, 0, 329.63, 0, 329.63, 392.00, 440.00, 493.88, 523.25, 587.33, 523.25, 0, 493.88, 0, 440.00, 392.00, 440.00, 493.88];
            this.sequencerInterval = setInterval(() => {
              if (this.ctx.state === 'suspended') this.ctx.resume();
              const currentStep = step % 32; const melodyNote = melody[currentStep % 32];
              if (melodyNote > 0) this.playTone(melodyNote, 'square', 0.1, 0.08);
              if (currentStep % 4 === 0) this.playTone(60, 'sine', 0.05, 0.3); 
              if (currentStep % 4 === 2) this.playNoise(0.03); step++;
            }, 130);
          }
          playFunkMusic() {
            if (this.isPlaying || !this.ctx) return; this.isPlaying = true; let step = 0;
            const bassSequence = [98.00, 0, 196.00, 0, 98.00, 116.54, 130.81, 0, 130.81, 0, 261.63, 0, 116.54, 98.00, 0, 0];
            const melodySequence = [0, 0, 783.99, 0, 0, 783.99, 0, 0, 0, 0, 932.33, 0, 0, 0, 1046.50, 0];
            this.sequencerInterval = setInterval(() => {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const currentStep = step % 16; const bassNote = bassSequence[currentStep];
                if (bassNote > 0) this.playTone(bassNote, 'sawtooth', 0.15, 0.2);
                const melodyNote = melodySequence[currentStep]; if (melodyNote > 0) this.playTone(melodyNote, 'square', 0.1, 0.1);
                if (currentStep % 4 === 0) this.playTone(60, 'sine', 0.05, 0.4); 
                if (currentStep % 4 === 2) this.playNoise(0.05); 
                if (currentStep % 2 === 0) this.playNoise(0.01); step++;
            }, 120); 
          }
          playEpicVictoryMusic() {
            if (this.isPlaying || !this.ctx) return; this.isPlaying = true; let step = 0;
            const chordC = [261.63, 329.63, 392.00]; const chordF = [349.23, 440.00, 523.25]; const chordG = [392.00, 493.88, 587.33];
            this.sequencerInterval = setInterval(() => {
               if (this.ctx.state === 'suspended') this.ctx.resume();
               const bar = Math.floor(step / 16) % 4; const beat = step % 16; let currentChord = chordC;
               if (bar === 1) currentChord = chordF; if (bar === 2) currentChord = chordG;
               if (beat % 2 === 0) { const note = currentChord[(beat / 2) % 3]; this.playTone(note, 'triangle', 0.4, 0.1); this.playTone(note / 2, 'sine', 0.4, 0.1); }
               step++;
            }, 100);
          }
          playBossTheme() {
            if (this.isPlaying || !this.ctx) return; this.isPlaying = true; let step = 0;
            this.sequencerInterval = setInterval(() => {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const beat = step % 8; this.playTone(82.41, 'sawtooth', 0.1, 0.2); 
                if (beat === 0 || beat === 4) this.playTone(41.20, 'square', 0.1, 0.3); 
                if (beat === 2 || beat === 6) this.playNoise(0.1); 
                if (Math.random() > 0.7) this.playTone(800 + Math.random() * 400, 'square', 0.05, 0.1);
                step++;
            }, 100);
          }
          playBossScream() {
              if (!this.ctx) return; const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
              osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, this.ctx.currentTime);
              osc.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 1.0);
              gain.gain.setValueAtTime(0.5, this.ctx.currentTime); gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1.0);
              osc.connect(gain); gain.connect(this.ctx.destination); osc.start(); osc.stop(this.ctx.currentTime + 1.0);
          }
          playSwordSound() { this.playNoise(0.1); this.playTone(600, 'triangle', 0.1, 0.1); }
          playPlayerHit() { this.playTone(100, 'sawtooth', 0.2, 0.3); this.playTone(80, 'square', 0.2, 0.3); }
          stopMusic() { if (this.sequencerInterval) clearInterval(this.sequencerInterval); if (this.sirenInterval) clearInterval(this.sirenInterval); this.isPlaying = false; }
          playExplosion() { 
              this.playNoise(0.15); 
              this.playTone(60, 'sawtooth', 0.4, 0.15); 
              this.playTone(40, 'square', 0.4, 0.15); 
          }
          playCorrect() { this.playTone(523.25, 'square', 0.1, 0.1); setTimeout(() => this.playTone(659.25, 'square', 0.1, 0.1), 80); setTimeout(() => this.playTone(783.99, 'square', 0.4, 0.1), 160); }
          playWrong() { this.playTone(150, 'sawtooth', 0.3, 0.2); setTimeout(() => this.playTone(100, 'sawtooth', 0.3, 0.2), 150); }
        }

        const audio = new AudioEngine();

        // --- COMPONENTS ---

        function Meltdown() { 
          const [gameState, setGameState] = useState('LOAD_FILE'); 
          const [round, setRound] = useState(1);
          const [scores, setScores] = useState({ t1: 0, t2: 0 });
          const [completed, setCompleted] = useState([]); 
          const [currentQ, setCurrentQ] = useState(null); 
          const [revealed, setRevealed] = useState(false);
          const [musicOn, setMusicOn] = useState(false);
          const [speaking, setSpeaking] = useState(false);
          const [isMeltdown, setIsMeltdown] = useState(false);
          const [doubleTroubleActive, setDoubleTroubleActive] = useState(false);
          const [bossPhase, setBossPhase] = useState('none'); 
          const [isBossHit, setIsBossHit] = useState(false);
          const [activeSpecialEvents, setActiveSpecialEvents] = useState({ bonus: [], trap: [], lucky: [], double: [] });

          const [introData, setIntroData] = useState({ active: false, phase: 'init', catIndex: 0 });
          const [gridFlyIn, setGridFlyIn] = useState(false);

          const getInitialSpeed = () => {
             const userAgent = window.navigator.userAgent || window.navigator.vendor || window.opera;
             if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) return 'slow';
             if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return 'slow';
             return 'normal';
          };

          const [ttsSpeedMode, setTtsSpeedMode] = useState(getInitialSpeed()); 
          const [fileError, setFileError] = useState('');

          const [bossBattle, setBossBattle] = useState({
              active: false, bossHP: 0, playerHP: 0, bossMaxHP: 0, playerMaxHP: 0, qIndex: 0, turn: 'player', phase: 'intro', currentDamage: 500 
          });

          const activeCategories = round === 1 ? (CATEGORIES_R1 || []) : (CATEGORIES_R2 || []);
          const activeQuestions = round === 1 ? QUESTIONS_R1 : QUESTIONS_R2;

          const winner = scores.t1 > scores.t2 ? 't1' : (scores.t2 > scores.t1 ? 't2' : 'draw');

          const handleFileUpload = (event) => {
              const file = event.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = (e) => {
                  try {
                      const success = parseQuestionsFile(e.target.result);
                      if (success) setGameState('INTRO');
                  } catch (err) {
                      setFileError('Fehler beim Lesen der Datei! Falsches Format?'); console.error(err);
                  }
              };
              reader.readAsText(file);
          };

          const startGame = () => {
            audio.init(); 
            setMusicOn(true);
            setActiveSpecialEvents(generateRandomEvents()); 
            startRoundIntroSequence();
          };

          const startRoundIntroSequence = () => {
              setGameState('ROUND_INTRO');
              setIntroData({ active: true, phase: 'fade_in', catIndex: 0 });
          };

          useEffect(() => {
            if (gameState !== 'ROUND_INTRO') return;

            let timeout;
            if (introData.phase === 'fade_in') {
                timeout = setTimeout(() => {
                    setIntroData(prev => ({ ...prev, phase: 'round_title' }));
                }, 1000);
            } else if (introData.phase === 'round_title') {
                 audio.playImpact();
                 speakText(`Runde ${round}`);
                 timeout = setTimeout(() => {
                     setIntroData(prev => ({ ...prev, phase: 'categories', catIndex: 0 }));
                 }, 2000);
            } else if (introData.phase === 'categories') {
                if (introData.catIndex < 5) {
                     const currentCat = activeCategories[introData.catIndex];
                     if (currentCat && currentCat.name) {
                         audio.playWhoosh();
                     }
                     timeout = setTimeout(() => {
                         setIntroData(prev => ({ ...prev, catIndex: prev.catIndex + 1 }));
                     }, 1000); 
                } else {
                     setIntroData(prev => ({ ...prev, phase: 'fade_out' }));
                }
            } else if (introData.phase === 'fade_out') {
                 timeout = setTimeout(() => {
                     setGameState('GRID');
                     setGridFlyIn(true);
                     setTimeout(() => setGridFlyIn(false), 1000);
                     if (round === 1) audio.playMusic(); else audio.playFunkMusic();
                 }, 100); 
            }
            return () => clearTimeout(timeout);
          }, [gameState, introData, round]);

          const toggleMusic = () => {
            if (musicOn) { audio.stopMusic(); } else {
              if (gameState === 'GAMEOVER') audio.playEpicVictoryMusic();
              else if (gameState === 'BOSS_BATTLE') audio.playBossTheme();
              else if (round === 1 && gameState === 'GRID') audio.playMusic();
              else if (round === 2 && gameState === 'GRID') audio.playFunkMusic();
            }
            setMusicOn(!musicOn);
          };

          const speakText = (text) => {
            if (!window.speechSynthesis) return; window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            let rate = 1.2 + Math.random() * 0.05; 
            if (ttsSpeedMode === 'slow') rate = rate * 0.9; 
            utter.rate = rate;
            const voices = window.speechSynthesis.getVoices();
            const deVoices = voices.filter(v => v.lang.includes('de'));
            if (deVoices.length > 0) utter.voice = deVoices[Math.floor(Math.random() * deVoices.length)];
            utter.onstart = () => setSpeaking(true); utter.onend = () => setSpeaking(false);
            window.speechSynthesis.speak(utter);
          };

          const debugFillRound = () => {
              const allIds = []; for(let c=0; c<5; c++) { for(let r=0; r<5; r++) { allIds.push(`${c}-${r}`); } }
              allIds.pop(); setCompleted(allIds); setScores({ t1: 1500, t2: 1200 });
          };

          const triggerRound2Warning = () => {
            audio.stopMusic(); setGameState('ROUND_TRANSITION_WARNING'); audio.playAlarmSequence(); 
            setTimeout(() => { audio.stopSirenLoop(); startRound2(); }, 4500); 
          };

          const startRound2 = () => {
              setRound(2); setCompleted([]); setDoubleTroubleActive(false); 
              setActiveSpecialEvents(generateRandomEvents()); 
              audio.stopMusic(); 
              startRoundIntroSequence();
          };

          const triggerTrueFinale = () => {
              if (winner === 'draw') { resetGame(); return; }

              // CLEAR ALL RELEVANT STATES
              setIntroData({ active: false, phase: 'init', catIndex: 0 });
              setGridFlyIn(false);
              setRevealed(false);
              setCurrentQ(null);

              if (BOSS_QUESTIONS.length > 0) {
                 for (let i = BOSS_QUESTIONS.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [BOSS_QUESTIONS[i], BOSS_QUESTIONS[j]] = [BOSS_QUESTIONS[j], BOSS_QUESTIONS[i]];
                 }
              }

              audio.stopMusic(); setGameState('TRUE_FINALE_INTRO'); setBossPhase('black_in'); 
              const pHP = Math.max(2000, (winner === 't1' ? scores.t1 : scores.t2));
              const bHP = Math.max(2000, (winner === 't1' ? scores.t2 : scores.t1));
              setBossBattle({ active: true, bossHP: bHP, playerHP: pHP, bossMaxHP: bHP, playerMaxHP: pHP, qIndex: 0, turn: 'player', phase: 'intro', currentDamage: 500 });
              setTimeout(() => setBossPhase('reveal'), 500); setTimeout(() => setBossPhase('text_in'), 2500);
              setTimeout(() => { setBossPhase('mutate_and_fade'); audio.playBossScream(); audio.playBossTheme(); }, 5000);
              
              // FALLBACK TIMER falls onAnimationEnd nicht feuert
              setTimeout(() => { 
                  if (gameState !== 'BOSS_BATTLE') {
                      setGameState('BOSS_BATTLE'); setBossBattle(prev => ({...prev, phase: 'start_screen'})); setRevealed(false);
                  }
              }, 14000);
          };

          const onMutationEnd = () => {
              if (bossPhase === 'mutate_and_fade') {
                  setGameState('BOSS_BATTLE'); setBossBattle(prev => ({...prev, phase: 'start_screen'})); setRevealed(false);
              }
          };

          const startBossAction = () => {
             setBossBattle(prev => ({...prev, phase: 'fight'}));
             const firstQ = BOSS_QUESTIONS[0] ? BOSS_QUESTIONS[0].q : "Fehler: Keine Bossfrage";
             speakText(firstQ);
          };

          const handleBossAnswer = (correct) => {
              const dmg = bossBattle.currentDamage; 
              if (correct) {
                  audio.playSwordSound(); setIsBossHit(true); setTimeout(() => setIsBossHit(false), 500);
                  const newBossHP = Math.max(0, bossBattle.bossHP - dmg);
                  setBossBattle(prev => ({ ...prev, bossHP: newBossHP, currentDamage: prev.currentDamage + 100 }));
                  if (newBossHP <= 0) {
                      setBossBattle(prev => ({...prev, phase: 'exploding'})); audio.stopMusic(); audio.playExplosion();
                      setTimeout(() => { setBossBattle(prev => ({...prev, phase: 'black_out_win'})); }, 2500);
                      setTimeout(() => { setBossBattle(prev => ({...prev, phase: 'win'})); audio.playEpicVictoryMusic(); }, 4500);
                  } else {
                      const nextQ = (bossBattle.qIndex + 1) % BOSS_QUESTIONS.length;
                      setBossBattle(prev => ({...prev, qIndex: nextQ})); setRevealed(false);
                      const qText = BOSS_QUESTIONS[nextQ].q; setTimeout(() => speakText(qText), 500);
                  }
              } else {
                  audio.playPlayerHit(); const newPlayerHP = Math.max(0, bossBattle.playerHP - dmg);
                  setBossBattle(prev => ({ ...prev, playerHP: newPlayerHP, currentDamage: prev.currentDamage + 100 }));
                  if (newPlayerHP <= 0) {
                      setBossBattle(prev => ({...prev, phase: 'lose'})); audio.stopMusic(); audio.playFailSound();
                  } else {
                      const nextQ = (bossBattle.qIndex + 1) % BOSS_QUESTIONS.length;
                      setBossBattle(prev => ({...prev, qIndex: nextQ})); setRevealed(false);
                      const qText = BOSS_QUESTIONS[nextQ].q; setTimeout(() => speakText(qText), 500);
                  }
              }
          };

          const handleSelectQuestion = (catIdx, qIdx) => {
            const uniqueId = `${catIdx}-${qIdx}`; const lookupPos = `${catIdx}-${qIdx}`;
            if (completed.includes(uniqueId)) return;
            audio.playExplosion();
            const categoryKey = activeCategories[catIdx].id;
            const questionPool = activeQuestions[categoryKey][qIdx];
            const randomQuestion = (questionPool && questionPool.length > 0) ? questionPool[Math.floor(Math.random() * questionPool.length)] : { q: "Daten fehlen!", a: "Bitte txt prüfen", points: 0 };
            const basePoints = (qIdx + 1) * 100;
            const qData = { ...randomQuestion, points: basePoints };
            setCurrentQ({ catIdx, qIdx, data: qData, id: uniqueId }); setRevealed(false);

            const isSafePeriod = completed.length < 5;
            if (!isSafePeriod && activeSpecialEvents.lucky.includes(lookupPos)) {
                setIsMeltdown(false); setGameState('LUCKY_INTRO'); audio.stopMusic(); audio.playJackpotSound();
                setTimeout(() => { setGameState('LUCKY_ACTIVE'); if (round === 1) audio.playMusic(); else audio.playFunkMusic(); }, 2000); return;
            }
            if (!isSafePeriod && activeSpecialEvents.trap.includes(lookupPos)) {
                setIsMeltdown(false); setGameState('TOTAL_MELTDOWN_INTRO'); audio.stopMusic(); audio.playFailSound();
                setTimeout(() => { audio.playExplosion(); setGameState('TOTAL_MELTDOWN_ACTIVE'); if (round === 1) audio.playMusic(); else audio.playFunkMusic(); }, 2000); return;
            }
            if (!isSafePeriod && activeSpecialEvents.double.includes(lookupPos)) {
                setIsMeltdown(false); setDoubleTroubleActive(true); setGameState('DOUBLE_TROUBLE_INTRO'); audio.stopMusic(); audio.playDoubleTroubleSound();
                setTimeout(() => { if (round === 1) audio.playMusic(); else audio.playFunkMusic(); setGameState('QUESTION'); }, 2000); return;
            }
            if (!isSafePeriod && activeSpecialEvents.bonus.includes(lookupPos)) {
              setIsMeltdown(true); setGameState('MELTDOWN_INTRO'); audio.stopMusic(); audio.startSirenLoop(); 
              setTimeout(() => { audio.stopSirenLoop(); if (round === 1) audio.playMusic(); else audio.playFunkMusic(); setGameState('QUESTION'); }, 2000); 
            } else { setIsMeltdown(false); setGameState('QUESTION'); }
          };

          useEffect(() => {
            if (gameState === 'QUESTION' && currentQ) { setTimeout(() => { speakText(currentQ.data.q); }, 800); } 
            else if (!['MELTDOWN_INTRO', 'TOTAL_MELTDOWN_INTRO', 'LUCKY_INTRO', 'DOUBLE_TROUBLE_INTRO', 'ROUND_INTRO'].includes(gameState)) {
              window.speechSynthesis.cancel(); setSpeaking(false);
            }
          }, [gameState, currentQ]);

          const getCurrentPoints = () => {
              if (!currentQ) return 0; let val = currentQ.data.points;
              if (round === 2) val *= 2; if (isMeltdown) val *= 3; if (doubleTroubleActive) val = Math.floor(val * 1.5);
              return val;
          };

          const handleAnswer = (correct, team) => {
            if (!currentQ) return;
            const finalPoints = getCurrentPoints();
            if (correct) { 
                audio.playCorrect(); 
                setScores(prev => ({ ...prev, [team]: prev[team] + finalPoints })); 
                finishQuestion(); 
            } else { 
                audio.playWrong(); 
                setScores(prev => ({ ...prev, [team]: Math.max(0, prev[team] - finalPoints) })); 
                finishQuestion(); 
            }
          };

          const applyPenalty = (team) => {
              const penalty = Math.floor(1000 * (round === 2 ? 2 : 1) * (doubleTroubleActive ? 1.5 : 1));
              audio.playExplosion(); 
              setScores(prev => ({ ...prev, [team]: Math.max(0, prev[team] - penalty) })); 
              finishQuestion();
          };
          const applyJackpot = (team) => {
              const bonus = Math.floor(1000 * (round === 2 ? 2 : 1) * (doubleTroubleActive ? 1.5 : 1));
              audio.playCorrect(); setScores(prev => ({ ...prev, [team]: prev[team] + bonus })); finishQuestion();
          };

          const finishQuestion = () => {
            setCompleted(prev => [...prev, currentQ.id]); setIsMeltdown(false); setRevealed(false); 
            if (completed.length + 1 >= 25) { 
                if (round === 1) {
                    setGameState('ROUND_1_SCORE_REVEAL'); audio.stopMusic(); audio.playJackpotSound();
                    setTimeout(() => { setGameState('ROUND_OVER'); audio.playElevatorMusic(); }, 4000); 
                } else {
                    setTimeout(() => { setGameState('GAMEOVER'); audio.stopMusic(); audio.playEpicVictoryMusic(); }, 1000);
                }
            } else { setGameState('GRID'); }
          };

          const resetGame = () => {
            setScores({ t1: 0, t2: 0 }); setCompleted([]); setDoubleTroubleActive(false); setRound(1); setBossBattle({ active: false });
            setActiveSpecialEvents(generateRandomEvents()); setGameState('INTRO'); audio.stopMusic(); 
          };

          const leadingTeam = scores.t1 > scores.t2 ? 'TEAM CYAN' : (scores.t2 > scores.t1 ? 'TEAM FUCHSIA' : 'UNENTSCHIEDEN');
          const loserColorText = winner === 't1' ? 'text-fuchsia-500' : 'text-cyan-400';

          return (
            <div className="relative w-full h-screen bg-slate-950 overflow-hidden font-mono text-white selection:bg-fuchsia-500 selection:text-white">
              
              <style>{`
                .text-glow-cyan { text-shadow: 0 0 10px cyan, 0 0 20px cyan; }
                .text-glow-fuchsia { text-shadow: 0 0 10px fuchsia, 0 0 20px fuchsia; }
